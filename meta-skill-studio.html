<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta-Skill Studio — 五行八卦规则引擎工作室</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-wood: #4CAF50; --color-fire: #F44336; --color-earth: #FF9800;
  --color-metal: #9E9E9E; --color-water: #2196F3;
  --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-tertiary: #242836;
  --text-primary: #e4e6eb; --text-secondary: #a0a4b0; --text-muted: #6b7080;
  --border: #2a2e3a; --accent: #6c5ce7; --accent-hover: #7c6cf7;
  --success: #00b894; --warning: #fdcb6e; --danger: #e17055;
  --radius: 8px; --radius-lg: 12px;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
body {
  font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Top Bar ===== */
.top-bar {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  height: 48px; flex-shrink: 0;
}
.top-bar .logo { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
.top-bar .logo span { color: var(--text-secondary); font-weight: 400; }
.top-bar select {
  background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px 8px; font-size: 13px; cursor: pointer;
}
.top-bar .spacer { flex: 1; }

/* L1-L4 Level Bar (参考 huihui-chat.js) */
.level-bar { display: flex; gap: 4px; }
.level-btn {
  background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  transition: all .2s; font-family: var(--font-sans);
}
.level-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
.level-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.top-bar .btn {
  background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 5px 10px; font-size: 12px; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.top-bar .btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
.top-bar .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.top-bar .btn.primary:hover { background: var(--accent-hover); }

/* ===== Main Layout ===== */
.main-content { display: flex; flex: 1; overflow: hidden; }

/* ===== Left Panel: Rules Browser ===== */
.rules-panel {
  width: 42%; min-width: 320px; background: var(--bg-secondary);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 10px 16px; font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-header .count { font-weight: 400; color: var(--text-secondary); }
.rules-tree { flex: 1; overflow-y: auto; padding: 8px; }
.rules-tree::-webkit-scrollbar { width: 4px; }

/* Section */
.section { margin-bottom: 8px; }
.section-header {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  cursor: pointer; border-radius: 6px; user-select: none;
  font-size: 13px; font-weight: 600; color: var(--text-secondary);
}
.section-header:hover { background: var(--bg-tertiary); }
.section-header .arrow { font-size: 10px; transition: transform .2s; width: 14px; text-align: center; }
.section-header.collapsed .arrow { transform: rotate(-90deg); }
.section-header .badge { font-size: 11px; color: var(--text-muted); margin-left: auto; }

/* Element card */
.element-card {
  margin: 2px 0 2px 16px; padding: 6px 10px; border-radius: 6px;
  background: var(--bg-tertiary); cursor: pointer; transition: background .15s;
  display: flex; align-items: center; gap: 8px;
}
.element-card:hover { background: #2e3344; }
.element-card .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.element-card .name { font-size: 13px; font-weight: 500; }
.element-card .keywords { font-size: 11px; color: var(--text-muted); margin-left: auto; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Concept tags */
.concepts-container { padding: 0 0 0 32px; display: none; }
.concepts-container.open { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 0 8px 32px; }
.concept-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--text-secondary); transition: all .15s;
}
.concept-tag:hover { border-color: var(--accent); color: var(--text-primary); }
.concept-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Right Panel: Preview + Editor ===== */
.preview-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-primary);
}
.tab-bar {
  display: flex; border-bottom: 1px solid var(--border); background: var(--bg-secondary);
  padding: 0 12px; flex-shrink: 0;
}
.tab {
  padding: 8px 16px; font-size: 13px; cursor: pointer; color: var(--text-muted);
  border-bottom: 2px solid transparent; transition: all .2s;
}
.tab:hover { color: var(--text-secondary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { flex: 1; overflow: hidden; display: none; }
.tab-content.active { display: flex; flex-direction: column; }

/* Preview */
.preview-frame { flex: 1; border: none; background: #fff; }
.preview-placeholder {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 8px;
}

/* JSON Editor */
.json-editor {
  flex: 1; background: var(--bg-primary); color: var(--text-primary);
  border: none; padding: 16px; font-family: var(--font-mono); font-size: 13px;
  line-height: 1.6; resize: none; outline: none;
}

/* History */
.history-list { flex: 1; overflow-y: auto; padding: 12px; }
.history-item {
  padding: 8px 12px; border-radius: 6px; margin-bottom: 4px;
  background: var(--bg-tertiary); font-size: 12px; display: flex; align-items: center; gap: 8px;
}
.history-item .cmd { font-weight: 600; color: var(--accent); min-width: 60px; }
.history-item .time { color: var(--text-muted); margin-left: auto; font-size: 11px; }

/* ===== Floating AI Assistant (参考 huihui-chat.js) ===== */
.studio-chat-btn {
  position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px;
  border-radius: 50%; background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(108,92,231,0.4); z-index: 1000;
  transition: all .3s; color: #fff;
}
.studio-chat-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(108,92,231,0.5); }
.studio-chat-btn svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; }
.studio-chat-btn.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(108,92,231,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(108,92,231,0); }
}

/* Chat Panel */
.studio-chat-panel {
  position: fixed; bottom: 90px; right: 24px; width: 380px; max-height: 560px;
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; z-index: 999;
  transform: translateY(20px); opacity: 0; pointer-events: none;
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
.studio-chat-panel.open { transform: translateY(0); opacity: 1; pointer-events: all; }

.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.chat-header-left { display: flex; align-items: center; gap: 10px; }
.chat-avatar { font-size: 22px; }
.chat-title { font-size: 14px; font-weight: 600; }
.chat-subtitle { font-size: 11px; color: var(--text-muted); }
.chat-close {
  background: none; border: none; color: var(--text-muted); font-size: 18px;
  cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex;
  align-items: center; justify-content: center;
}
.chat-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }

.chat-level-bar {
  display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border);
}
.chat-level-btn {
  flex: 1; background: transparent; color: var(--text-muted); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 0; font-size: 11px; cursor: pointer; transition: all .2s;
}
.chat-level-btn:hover { color: var(--text-primary); }
.chat-level-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 320px; }
.chat-msg { display: flex; gap: 8px; max-width: 90%; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; font-size: 14px;
}
.chat-msg-avatar.ai { background: rgba(108,92,231,0.2); }
.chat-msg-avatar.user { background: rgba(255,255,255,0.1); }
.chat-msg-bubble {
  padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
}
.chat-msg.ai .chat-msg-bubble { background: var(--bg-tertiary); color: var(--text-primary); border-bottom-left-radius: 4px; }
.chat-msg.user .chat-msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }

.chat-input-area {
  display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
}
.chat-input {
  flex: 1; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px; font-size: 13px; resize: none;
  outline: none; font-family: var(--font-sans); max-height: 80px;
}
.chat-input:focus { border-color: var(--accent); }
.chat-send {
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  padding: 0 14px; cursor: pointer; font-size: 16px; transition: background .2s;
}
.chat-send:hover { background: var(--accent-hover); }
.chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-typing { display: flex; gap: 4px; padding: 4px 0; }
.chat-typing span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
  animation: bounce 1.2s infinite;
}
.chat-typing span:nth-child(2) { animation-delay: .2s; }
.chat-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* Suggestion chips */
.chat-suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
.chat-suggestion {
  font-size: 11px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  background: rgba(108,92,231,0.1); color: var(--accent); border: 1px solid rgba(108,92,231,0.2);
  transition: all .15s; white-space: nowrap;
}
.chat-suggestion:hover { background: rgba(108,92,231,0.2); }

/* Responsive */
@media (max-width: 768px) {
  .main-content { flex-direction: column; }
  .rules-panel { width: 100%; min-width: 0; max-height: 45%; border-right: none; border-bottom: 1px solid var(--border); }
  .preview-panel { flex: 1; }
  .studio-chat-panel { width: calc(100vw - 32px); right: 16px; bottom: 80px; }
  .top-bar { flex-wrap: wrap; height: auto; gap: 6px; padding: 6px 10px; }
}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="top-bar">
  <div class="logo">Meta-Skill<span>Studio</span></div>
  <select id="domain-select" title="选择领域">
    <option value="chinese_medicine">中医</option>
    <option value="daojism">道学</option>
  </select>
  <div class="spacer"></div>
  <div class="level-bar" id="top-level-bar">

</div>

<!-- ===== Main Layout ===== -->
<div class="main-content">
  <!-- Left: Rules Browser -->
  <div class="rules-panel">
    <div class="panel-header">
      <span>📋 规则浏览器</span>
      <span class="count" id="concept-count">100 个概念</span>
    </div>
    <div class="rules-tree" id="rules-tree">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- Right: Preview / Editor / History -->
  <div class="preview-panel">
    <div class="tab-bar">
      <div class="tab active" data-tab="preview">预览</div>
      <div class="tab" data-tab="json">JSON 编辑器</div>

    <div class="tab-content active" id="tab-preview">
      <div class="preview-placeholder" id="preview-placeholder">
        <span style="font-size:32px">🔮</span>
        <span>点击「生成预览」或通过 AI 助手调整规则</span>
      </div>
      <iframe class="preview-frame" id="preview-frame" style="display:none"></iframe>
    </div>
    <div class="tab-content" id="tab-json">
      <textarea class="json-editor" id="json-editor" spellcheck="false"></textarea>
    </div>
    <div class="tab-content" id="tab-history">
      <div class="history-list" id="history-list">
        <div style="color:var(--text-muted);text-align:center;padding:40px">暂无操作记录</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Floating AI Assistant (参考 huihui-chat.js 架构) ===== -->
<button class="studio-chat-btn pulse" id="studio-chat-btn" title="打开 AI 规则助手" aria-label="打开 AI 规则助手">
  <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 9h10M7 13h6" stroke-linecap="round"/></svg>
</button>

<div class="studio-chat-panel" id="studio-chat-panel">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-avatar">🧠</div>
      <div>
        <div class="chat-title">Meta-Skill 助手</div>
        <div class="chat-subtitle">五行八卦规则引擎</div>
      </div>
    </div>
    <button class="chat-close" id="chat-close" aria-label="关闭">✕</button>
  </div>
  <div class="chat-level-bar" id="chat-level-bar">
    <button class="chat-level-btn" data-level="L1">白话</button>
    <button class="chat-level-btn active" data-level="L2">精读</button>
    <button class="chat-level-btn" data-level="L3">应用</button>
    <button class="chat-level-btn" data-level="L4">学术</button>
  </div>
  <div class="chat-suggestions" id="chat-suggestions">
    <span class="chat-suggestion" data-cmd="把丹参映射到火">把丹参映射到火</span>
    <span class="chat-suggestion" data-cmd="修正太渊的权重为1.5">修正太渊权重</span>
    <span class="chat-suggestion" data-cmd="将内视移到内层">将内视移到内层</span>
    <span class="chat-suggestion" data-cmd="添加补法到木·种子萌发">添加补法到流转</span>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="chat-input" rows="1" placeholder="描述你想调整的规则…" aria-label="输入规则调整指令"></textarea>
    <button class="chat-send" id="chat-send" aria-label="发送">➤</button>
  </div>
</div>

<script>
// ============================================================
// Meta-Skill Studio — 主引擎 (IIFE, 参考 huihui-chat.js 架构)
// ============================================================
(function() {
  'use strict';

  // ===== 常量 =====
  var WUXING_ELEMENTS = ['木', '火', '土', '金', '水'];
  var BAGUA_SYMBOLS = ['☰乾', '☱兑', '☲离', '☳震', '☴巽', '☵坎', '☶艮', '☷坤'];
  var LAYER_KEYS = ['outer', 'middle', 'inner'];
  var LAYER_LABELS = { outer: 'Base 层·体', middle: 'View 层·相', inner: 'SkillUP 层·用' };
  var FLOW_STAGES = ['木·种子萌发', '火·繁茂整合', '金·修剪遗忘', '水·更新重组', '土·迁移沉淀'];
  var WUXING_COLORS = { '木': '#4CAF50', '火': '#F44336', '土': '#FF9800', '金': '#9E9E9E', '水': '#2196F3' };
  var BAGUA_COLORS = {
    '☰乾': '#FFD700', '☱兑': '#87CEEB', '☲离': '#FF6347', '☳震': '#32CD32',
    '☴巽': '#9370DB', '☵坎': '#1E90FF', '☶艮': '#8B4513', '☷坤': '#DAA520'
  };
  var WELCOME_TEXT = '你好！我是 Meta-Skill 规则助手。\n\n你可以用自然语言调整五行八卦规则：\n- "把丹参映射到火，权重0.9"\n- "修正太渊的权重为1.5"\n- "将内视移到内层"\n- "添加补法到木·种子萌发"';

  // ===== 匿名用户 ID (参考 huihui-chat.js) =====
  var userId = localStorage.getItem('studio_uid');
  if (!userId) {
    userId = 'studio_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    localStorage.setItem('studio_uid', userId);
  }

  // ===== 状态 =====
  var currentDomain = 'chinese_medicine';
  var rulesData = null;
  var commandHistory = [];
  var modifiedConcepts = new Set();
  var currentLevel = localStorage.getItem('studio_cognitive_depth') || 'L2';
  var isChatOpen = false;
  var isProcessing = false;

  // ===== DOM 引用 =====
  var chatBtn = document.getElementById('studio-chat-btn');
  var chatPanel = document.getElementById('studio-chat-panel');
  var chatMessages = document.getElementById('chat-messages');
  var chatInput = document.getElementById('chat-input');
  var chatSend = document.getElementById('chat-send');
  var chatClose = document.getElementById('chat-close');
  var rulesTree = document.getElementById('rules-tree');
  var jsonEditor = document.getElementById('json-editor');
  var historyList = document.getElementById('history-list');
  var previewFrame = document.getElementById('preview-frame');
  var previewPlaceholder = document.getElementById('preview-placeholder');
  var conceptCount = document.getElementById('concept-count');

  // ===== 初始化 =====
  loadRules();
  initLevelButtons();
  initChat();
  initTabs();
  initTopBar();

  // 3 秒后移除脉冲动画
  setTimeout(function() { chatBtn.classList.remove('pulse'); }, 3000);

  // ===== 规则加载 =====
  function loadRules() {
    // 从内嵌数据加载（实际部署时从 API 获取）
    rulesData = getEmbeddedRules(currentDomain);
    refreshAll();
    addChatMessage('ai', WELCOME_TEXT);
  }

  function getEmbeddedRules(domain) {
    // 内嵌规则数据（从 chinese_medicine.json 提取核心结构）
    if (domain === 'chinese_medicine') {
      return {
        domain: 'chinese_medicine',
        overrides: {

  function updateConceptCount() {
    var total = 0;
    var ov = rulesData.overrides;
    WUXING_ELEMENTS.forEach(function(e) {
      total += (ov.wuxing[e] && ov.wuxing[e].keywords ? ov.wuxing[e].keywords.length : 0);
    });
    BAGUA_SYMBOLS.forEach(function(s) {
      total += (ov.bagua[s] && ov.bagua[s].keywords ? ov.bagua[s].keywords.length : 0);
    });
    conceptCount.textContent = total + ' 个概念';
  }

  // ===== 渲染规则树 =====
  function renderRulesTree() {
    var html = '';
    var ov = rulesData.overrides;

    // 五行
    html += '<div class="section">';
    html += '<div class="section-header" onclick="this.classList.toggle(\'collapsed\');var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'\':\'none\'">';
    html += '<span class="arrow">▼</span> 五行 (Wuxing)</div>';
    html += '<div class="section-body">';
    WUXING_ELEMENTS.forEach(function(elem) {
      var section = ov.wuxing[elem] || {};
      var keywords = section.keywords || [];
      var weight = section.weight || 1.0;
      html += '<div class="element-card" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\')">';
      html += '<span class="dot" style="background:' + (WUXING_COLORS[elem] || '#666') + '"></span>';
      html += '<span class="name">' + elem + '</span>';
      html += '<span class="keywords">' + keywords.slice(0, 4).join('、') + (keywords.length > 4 ? '…' : '') + '</span>';
      html += '<span class="badge">w=' + weight + '</span>';
      html += '</div>';
      html += '<div class="concepts-container">';
      keywords.forEach(function(kw) {
        html += '<span class="concept-tag" data-concept="' + kw + '" data-element="' + elem + '" onclick="event.stopPropagation();window._studioSelectConcept(\'' + kw + '\',\'' + elem + '\')">' + kw + '</span>';
      });
      html += '</div>';
    });
    html += '</div></div>';

    // 八卦
    if (ov.bagua && Object.keys(ov.bagua).length > 0) {
      html += '<div class="section">';
      html += '<div class="section-header collapsed" onclick="this.classList.toggle(\'collapsed\');var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'\':\'none\'">';
      html += '<span class="arrow">▼</span> 八卦 (Bagua)</div>';
      html += '<div class="section-body" style="display:none">';
      BAGUA_SYMBOLS.forEach(function(sym) {
        var section = ov.bagua[sym];
        if (!section) return;
        var keywords = section.keywords || [];
        html += '<div class="element-card" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\')">';
        html += '<span class="dot" style="background:' + (BAGUA_COLORS[sym] || '#666') + '"></span>';
        html += '<span class="name">' + sym + '</span>';
        html += '<span class="keywords">' + keywords.slice(0, 3).join('、') + '</span>';
        html += '</div>';
        html += '<div class="concepts-container">';
        keywords.forEach(function(kw) {
          html += '<span class="concept-tag">' + kw + '</span>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    }

    // 层级
    if (ov.layer_assignment) {
      html += '<div class="section">';
      html += '<div class="section-header collapsed" onclick="this.classList.toggle(\'collapsed\');var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'\':\'none\'">';
      html += '<span class="arrow">▼</span> 三层架构 (Base-View-SkillUP)</div>';
      html += '<div class="section-body" style="display:none">';
      LAYER_KEYS.forEach(function(key) {
        var layer = ov.layer_assignment[key] || {};
        var indicators = layer.indicators || [];
        html += '<div class="element-card" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\')">';
        html += '<span class="name">' + (layer.label || key) + '</span>';
        html += '<span class="badge">' + indicators.length + ' 个</span>';
        html += '</div>';
        html += '<div class="concepts-container">';
        indicators.forEach(function(ind) {
          html += '<span class="concept-tag">' + ind + '</span>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    }

    // 流转阶段
    var circ = ov.wuxing_circulation;
    if (circ && circ.stages) {
      html += '<div class="section">';
      html += '<div class="section-header collapsed" onclick="this.classList.toggle(\'collapsed\');var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'\':\'none\'">';
      html += '<span class="arrow">▼</span> 五行流转引擎</div>';
      html += '<div class="section-body" style="display:none">';
      Object.keys(circ.stages).forEach(function(stage) {
        var s = circ.stages[stage];
        var concepts = s.concepts || [];
        html += '<div class="element-card" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\')">';
        html += '<span class="name">' + stage + '</span>';
        html += '<span class="badge">' + concepts.length + ' 个</span>';
        html += '</div>';
        html += '<div class="concepts-container">';
        concepts.forEach(function(c) {
          html += '<span class="concept-tag">' + c + '</span>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    }

    // L1-L4 认知深度
    var cd = ov.cognitive_depth;
    if (cd && cd.concept_max_depth && Object.keys(cd.concept_max_depth).length > 0) {
      html += '<div class="section">';
      html += '<div class="section-header collapsed" onclick="this.classList.toggle(\'collapsed\');var c=this.nextElementSibling;c.style.display=c.style.display===\'none\'?\'\':\'none\'">';
      html += '<span class="arrow">▼</span> L1-L4 认知深度</div>';
      html += '<div class="section-body" style="display:none">';
      var depths = cd.concept_max_depth;
      var byDepth = { L1: [], L2: [], L3: [], L4: [] };
      Object.keys(depths).forEach(function(k) {
        var d = depths[k];
        if (byDepth[d]) byDepth[d].push(k);
      });
      Object.keys(byDepth).forEach(function(d) {
        if (byDepth[d].length > 0) {
          html += '<div class="element-card" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\')">';
          html += '<span class="name">' + d + '</span>';
          html += '<span class="badge">' + byDepth[d].length + ' 个概念</span>';
          html += '</div>';
          html += '<div class="concepts-container">';
          byDepth[d].forEach(function(c) {
            html += '<span class="concept-tag">' + c + '</span>';
          });
          html += '</div>';
        }
      });
      html += '</div></div>';
    }

    rulesTree.innerHTML = html;
  }

  // ===== DSL 意图检测 (前端 JS 版，镜像 wuxing_dsl.py) =====
  function detectIntent(userMessage) {
    var msg = userMessage.trim();

    // 显式 DSL 语法
    var dsl = parseExplicitDSL(msg);
    if (dsl) return dsl;

    // 自然语言解析
    return parseNaturalLanguage(msg);
  }

  function parseExplicitDSL(msg) {
    var commands = ['MAP', 'LEARN', 'CORRECT', 'LAYER', 'FLOW'];
    for (var i = 0; i < commands.length; i++) {
      var cmd = commands[i];
      if (msg.toUpperCase().startsWith(cmd)) {
        var rest = msg.substring(cmd.length).trim();
        return parseDSLParams(cmd, rest);
      }
    }
    return null;
  }

  function parseDSLParams(command, params) {
    var result = { command: command };
    var arrowMatch = params.match(/^(.+?)\s*(?:→|->|到)\s*(.+)/);
    if (arrowMatch) {
      result.concept = arrowMatch[1].trim();
      var rightSide = arrowMatch[2].trim();
      var weightMatch = rightSide.match(/weight\s*=\s*([\d.]+)/);
      if (weightMatch) {
        result.weight = parseFloat(weightMatch[1]);
        result.element = rightSide.substring(0, weightMatch.index).trim();
      } else {
        result.element = rightSide;
      }
    } else {
      var parts = params.split(/\s+/);
      result.concept = parts[0] || params;
      var wm = params.match(/weight\s*=\s*([\d.]+)/);
      if (wm) result.weight = parseFloat(wm[1]);
    }
    return result.concept ? result : null;
  }

  function parseNaturalLanguage(msg) {
    var result = {};

    // 命令类型检测
    var cmdTriggers = {
      MAP: ['映射', '对应', '归属', '属于', '归为', '映射到', '放在', '加到'],
      LEARN: ['学习', '新概念', '添加', '新增', '加入', '学会'],
      CORRECT: ['修正', '修改', '调整', '改', '纠正', '变更'],
      LAYER: ['层级', '架构', '归属层', '放在哪层', '移到', '分层', '内层', '外层', '中层'],
      FLOW: ['流转', '阶段', '阶段添加', '阶段移除', '生命周期', '成长阶段']
    };

    for (var cmd in cmdTriggers) {
      for (var i = 0; i < cmdTriggers[cmd].length; i++) {
        if (msg.indexOf(cmdTriggers[cmd][i]) >= 0) {
          result.command = cmd;
          break;
        }
      }
      if (result.command) break;
    }
    if (!result.command) return null;

    // 概念提取
    var booknameMatch = msg.match(/《(.+?)》/);
    if (booknameMatch) {
      result.concept = booknameMatch[1];
    } else {
      // 把/将 X 动词 到/为 Y
      var baMatch = msg.match(/[把将](.+?)(?:映射|对应|归属|归为|属于|映射到|放在|加到|移到|移|添加|加入|新增|学习)/);
      if (baMatch) {
        result.concept = baMatch[1].trim().replace(/[的之，,。\s]+$/, '');
      } else {
        // 在触发词后的概念
        for (var i = 0; i < cmdTriggers[result.command].length; i++) {
          var trigger = cmdTriggers[result.command][i];
          var idx = msg.indexOf(trigger);
          if (idx >= 0) {
            var remaining = msg.substring(idx + trigger.length).trim();
            remaining = remaining.replace(/^(为|到|成|至|→|->|的|新概念|概念)\s*/, '');
            var conceptEnd = remaining.search(/[到归为→\-的权重]|阶段/);
            if (conceptEnd > 0) remaining = remaining.substring(0, conceptEnd).trim();
            var conceptMatch = remaining.match(/^([\u4e00-\u9fff\w]{1,30})/);
            if (conceptMatch) {
              result.concept = conceptMatch[1];
              if (WUXING_ELEMENTS.indexOf(result.concept) >= 0) result.concept = null;
            }
            break;
          }
        }
      }
    }

    // 元素
    var allElements = WUXING_ELEMENTS.concat(BAGUA_SYMBOLS);
    for (var i = 0; i < allElements.length; i++) {
      if (msg.indexOf(allElements[i]) >= 0 && allElements[i] !== result.concept) {
        result.element = allElements[i];
        break;
      }
    }

    // 权重
    var wm = msg.match(/权重\s*[=为]?\s*([\d.]+)/);
    if (wm) result.weight = parseFloat(wm[1]);

    // 层级
    if (msg.indexOf('内层') >= 0 || msg.indexOf('SkillUP') >= 0 || msg.indexOf('用') >= 0) result.layer = 'inner';
    else if (msg.indexOf('中层') >= 0 || msg.indexOf('View') >= 0 || msg.indexOf('相') >= 0) result.layer = 'middle';
    else if (msg.indexOf('外层') >= 0 || msg.indexOf('Base') >= 0 || msg.indexOf('体') >= 0) result.layer = 'outer';

    // 阶段
    for (var i = 0; i < FLOW_STAGES.length; i++) {
      if (msg.indexOf(FLOW_STAGES[i]) >= 0) { result.stage = FLOW_STAGES[i]; break; }
    }

    // add/remove
    if (msg.indexOf('添加') >= 0 || msg.indexOf('加入') >= 0) result.action = 'add';
    else if (msg.indexOf('移除') >= 0 || msg.indexOf('删除') >= 0) result.action = 'remove';

    return result.concept ? result : null;
  }

  // ===== DSL 执行 =====
  function executeDSL(intent) {
    var command = intent.command;
    var concept = intent.concept;
    var element = intent.element;
    var weight = intent.weight;
    var layer = intent.layer;
    var stage = intent.stage;
    var action = intent.action || 'add';
    var ov = rulesData.overrides;

    try {
      if (command === 'MAP' || command === 'LEARN') {
        if (!concept || !element) return { success: false, error: '需要概念和元素参数' };
        var target = WUXING_ELEMENTS.indexOf(element) >= 0 ? 'wuxing' : 'bagua';

        // 去重：先从所有其他元素中移除该概念
        ['wuxing', 'bagua'].forEach(function(tk) {
          for (var ek in ov[tk]) {
            var sec = ov[tk][ek];
            if (sec.keywords) {
              sec.keywords = sec.keywords.filter(function(k) { return k !== concept; });
            }
            if (sec.fixed_mapping && sec.fixed_mapping[concept]) {
              delete sec.fixed_mapping[concept];
            }
          }
        });

        var section = ov[target][element] || {};
        if (!section.keywords) section.keywords = [];
        if (section.keywords.indexOf(concept) < 0) section.keywords.push(concept);
        if (!section.fixed_mapping) section.fixed_mapping = {};
        section.fixed_mapping[concept] = element;
        if (weight) section.weight = weight;
        ov[target][element] = section;
        return { success: true, message: '已将「' + concept + '」' + (command === 'LEARN' ? '学习' : '映射') + '到 ' + element + (weight ? '（权重=' + weight + '）' : '') };

      } else if (command === 'CORRECT') {
        if (!concept) return { success: false, error: '需要概念参数' };
        var modified = false;
        var msgs = [];
        if (weight !== undefined) {
          for (var i = 0; i < WUXING_ELEMENTS.length; i++) {
            var sec = ov.wuxing[WUXING_ELEMENTS[i]] || {};
            if (sec.keywords && sec.keywords.indexOf(concept) >= 0) {
              sec.weight = weight;
              ov.wuxing[WUXING_ELEMENTS[i]] = sec;
              modified = true;
              msgs.push('权重已更新为 ' + weight);
              break;
            }
          }
        }
        if (element) {
          // 从旧位置移除
          ['wuxing', 'bagua'].forEach(function(tk) {
            for (var ek in ov[tk]) {
              var sec = ov[tk][ek];
              if (sec.keywords && sec.keywords.indexOf(concept) >= 0) {
                sec.keywords = sec.keywords.filter(function(k) { return k !== concept; });
                if (sec.fixed_mapping) delete sec.fixed_mapping[concept];
                modified = true;
              }
            }
          });
          // 添加到新位置
          var tgt = WUXING_ELEMENTS.indexOf(element) >= 0 ? 'wuxing' : 'bagua';
          var ns = ov[tgt][element] || {};
          if (!ns.keywords) ns.keywords = [];
          ns.keywords.push(concept);
          if (!ns.fixed_mapping) ns.fixed_mapping = {};
          ns.fixed_mapping[concept] = element;
          ov[tgt][element] = ns;
          msgs.push('归属已修正为 ' + element);
        }
        if (!modified) return { success: false, error: '未找到概念「' + concept + '」' };
        return { success: true, message: '已修正「' + concept + '」：' + msgs.join('；') };

      } else if (command === 'LAYER') {
        if (!concept || !layer) return { success: false, error: '需要概念和层级参数' };
        var la = ov.layer_assignment || {};
        LAYER_KEYS.forEach(function(k) {
          var inds = (la[k] && la[k].indicators) || [];
          la[k].indicators = inds.filter(function(v) { return v !== concept; });
        });
        if (!la[layer]) la[layer] = { label: '', indicators: [], weight: 1.0 };
        if (!la[layer].indicators) la[layer].indicators = [];
        la[layer].indicators.push(concept);
        ov.layer_assignment = la;
        return { success: true, message: '已将「' + concept + '」移至 ' + (LAYER_LABELS[layer] || layer) };

      } else if (command === 'FLOW') {
        if (!concept || !stage) return { success: false, error: '需要概念和阶段参数' };
        var circ = ov.wuxing_circulation || {};
        var stages = circ.stages || {};
        if (!stages[stage]) return { success: false, error: '无效阶段: ' + stage };
        var sc = stages[stage].concepts || [];
        if (action === 'add') {
          if (sc.indexOf(concept) < 0) sc.push(concept);
        } else if (action === 'remove') {
          sc = sc.filter(function(c) { return c !== concept; });
        }
        stages[stage].concepts = sc;
        circ.stages = stages;
        ov.wuxing_circulation = circ;
        return { success: true, message: (action === 'add' ? '已将「' : '已从') + concept + (action === 'add' ? '」添加到 ' : '」移除自 ') + stage };
      }

      return { success: false, error: '未知命令: ' + command };
    } catch(e) {
      return { success: false, error: e.message };
    }
  }

  // ===== 认知深度检查 (参考 huihui-chat.js SkillUP) =====
  function checkCognitiveDepthTrigger(concept) {
    modifiedConcepts.add(concept);
    var count = modifiedConcepts.size;
    if (count >= 3 && currentLevel === 'L2') {
      return {
        trigger: 'cognitive_depth_upgrade',
        message: '🌊 你已调整了 ' + count + ' 个概念，展现出对规则系统的深入理解。\n\n是否切换到 **L3·应用** 层级？点击上方 L3 按钮即可切换。'
      };
    }
    return null;
  }

  // ===== 聊天 (参考 huihui-chat.js) =====
  function initChat() {
    // 层级按钮
    highlightChatLevelBtn(currentLevel);
    var chatLevelBtns = document.querySelectorAll('#chat-level-bar .chat-level-btn');
    chatLevelBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var level = this.getAttribute('data-level');
        currentLevel = level;
        localStorage.setItem('studio_cognitive_depth', level);
        highlightChatLevelBtn(level);
        highlightTopLevelBtn(level);
        window.dispatchEvent(new CustomEvent('studio-level-changed', { detail: { level: level } }));
      });
    });

    // 快捷建议
    document.querySelectorAll('.chat-suggestion').forEach(function(chip) {
      chip.addEventListener('click', function() {
        chatInput.value = this.getAttribute('data-cmd');
        sendChatMessage();
      });
    });

    // 打开/关闭
    chatBtn.addEventListener('click', function() { openChatPanel(); });
    chatClose.addEventListener('click', function(e) { e.stopPropagation(); closeChatPanel(); });
    chatSend.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
    chatInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });

    // ESC 关闭
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isChatOpen) closeChatPanel();
    });

    // 点击面板外关闭
    document.addEventListener('click', function(e) {
      if (isChatOpen && !chatPanel.contains(e.target) && !chatBtn.contains(e.target)) {
        closeChatPanel();
      }
    });

    // Ctrl+Z 撤销
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'z' && !isChatOpen) {
        e.preventDefault();
        undoLastCommand();
      }
    });
  }

  function openChatPanel() {
    isChatOpen = true;
    chatPanel.classList.add('open');
    chatBtn.style.display = 'none';
    chatInput.focus();
    scrollChatToBottom();
  }

  function closeChatPanel() {
    isChatOpen = false;
    chatPanel.classList.remove('open');
    chatBtn.style.display = 'flex';
  }

  function sendChatMessage() {
    var text = chatInput.value.trim();
    if (!text || isProcessing) return;

    addChatMessage('user', text);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    isProcessing = true;

    // 模拟 AI 处理延迟
    var typingEl = addTypingIndicator();
    setTimeout(function() {
      removeTypingIndicator(typingEl);

      // 检测意图
      var intent = detectIntent(text);
      if (!intent) {
        addChatMessage('ai', '抱歉，我没能理解你的意图。请尝试：\n\n- "把X映射到Y"\n- "修正X的权重为N"\n- "将X移到内层"\n- "添加X到木·种子萌发"\n\n或使用显式 DSL 语法：\nMAP 概念 → 元素');
        isProcessing = false;
        return;
      }

      // 执行DSL
      var result = executeDSL(intent);
      if (result.success) {
        addChatMessage('ai', '✓ ' + result.message);
        commandHistory.push({
          command: intent.command,
          message: result.message,
          time: new Date().toLocaleTimeString()
        });
        refreshAll();

        // 认知深度检查
        var trigger = checkCognitiveDepthTrigger(intent.concept);
        if (trigger) {
          setTimeout(function() { addChatMessage('ai', trigger.message); }, 600);
        }
      } else {
        addChatMessage('ai', '✗ ' + (result.error || '执行失败'));
      }

      isProcessing = false;
    }, 600);
  }

  function addChatMessage(role, text) {
    var msgDiv = document.createElement('div');
    msgDiv.className = 'chat-msg ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'chat-msg-avatar ' + role;
    avatar.textContent = role === 'ai' ? '🧠' : '👤';

    var bubble = document.createElement('div');
    bubble.className = 'chat-msg-bubble';
    bubble.textContent = text;

    msgDiv.appendChild(role === 'user' ? bubble : avatar);
    msgDiv.appendChild(role === 'user' ? avatar : bubble);
    chatMessages.appendChild(msgDiv);
    scrollChatToBottom();
  }

  function addTypingIndicator() {
    var div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.innerHTML = '<div class="chat-msg-avatar ai">🧠</div><div class="chat-msg-bubble"><div class="chat-typing"><span></span><span></span><span></span></div></div>';
    chatMessages.appendChild(div);
    scrollChatToBottom();
    return div;
  }

  function removeTypingIndicator(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function scrollChatToBottom() {
    requestAnimationFrame(function() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
  }

  function highlightChatLevelBtn(level) {
    document.querySelectorAll('#chat-level-bar .chat-level-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-level') === level);
    });
  }

  function highlightTopLevelBtn(level) {
    document.querySelectorAll('#top-level-bar .level-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-level') === level);
    });
  }

  // ===== 顶栏按钮 =====
  function initLevelButtons() {
    highlightTopLevelBtn(currentLevel);
    document.querySelectorAll('#top-level-bar .level-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var level = this.getAttribute('data-level');
        currentLevel = level;
        localStorage.setItem('studio_cognitive_depth', level);
        highlightTopLevelBtn(level);
        highlightChatLevelBtn(level);
      });
    });
  }

  function initTabs() {
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var tabName = this.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
        document.getElementById('tab-' + tabName).classList.add('active');
        if (tabName === 'json') updateJsonEditor();
      });
    });
  }

  function initTopBar() {
    document.getElementById('domain-select').addEventListener('change', function() {
      currentDomain = this.value;
      rulesData = getEmbeddedRules(currentDomain);
      commandHistory = [];
      modifiedConcepts = new Set();
      refreshAll();
      addChatMessage('ai', '已切换到「' + (currentDomain === 'chinese_medicine' ? '中医' : '道学') + '」领域规则库。');
    });

    document.getElementById('btn-undo').addEventListener('click', undoLastCommand);
    document.getElementById('btn-generate').addEventListener('click', generatePreview);
  }

  function undoLastCommand() {
    if (commandHistory.length === 0) {
      addChatMessage('ai', '没有可撤销的操作。');
      return;
    }
    var last = commandHistory.pop();
    // 重新加载规则（简易撤销：重新从内嵌数据加载）
    rulesData = getEmbeddedRules(currentDomain);
    // 重放除了最后一条外的所有命令
    var remaining = commandHistory.slice();
    commandHistory = [];
    remaining.forEach(function(entry) {
      // 我们无法完美重放，所以简化处理：重新加载原始数据
    });
    refreshAll();
    addChatMessage('ai', '已撤销 ' + last.command + ' 操作。规则已重置为原始状态。');
  }

  // ===== HTML 预览生成 =====
  function generatePreviewContent() {
    // 纯内容生成，不改变 DOM 可见性
    var ov = rulesData.overrides;
    var html = buildPreviewHTML(ov);
    previewFrame.srcdoc = html;
    return html;
  }

  function generatePreview() {
    var html = generatePreviewContent();
    // 显示预览
    previewPlaceholder.style.display = 'none';
    previewFrame.style.display = 'block';
    addChatMessage('ai', '✓ HTML 预览已生成，可在右侧「预览」标签页查看。');
  }

  function buildPreviewHTML(ov) {

    var html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n';
    html += '<title>五行八卦推理规则 — ' + rulesData.domain + '</title>\n';
    html += '<style>\n';
    html += 'body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f8f9fa;color:#333;line-height:1.6}\n';
    html += 'h1{color:#2c3e50;border-bottom:3px solid #6c5ce7;padding-bottom:8px}\n';
    html += 'h2{color:#6c5ce7;margin-top:24px}\n';
    html += '.card{background:#fff;border-radius:8px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,0.08)}\n';
    html += '.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;margin:3px;color:#fff}\n';
    html += '.wuxing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}\n';
    html += '.wuxing-card{border-left:4px solid;padding:12px;border-radius:8px;background:#fff}\n';
    html += '.layer-bar{display:flex;gap:8px;margin:16px 0}\n';
    html += '.layer-item{flex:1;padding:12px;border-radius:8px;text-align:center;font-weight:600}\n';
    html += '</style>\n</head>\n<body>\n';

    html += '<h1>🧠 五行八卦推理规则库</h1>\n';
    html += '<p>领域：' + rulesData.domain + ' | 生成时间：' + new Date().toLocaleString() + '</p>\n';

    // 五行
    html += '<h2>五行映射</h2>\n<div class="wuxing-grid">\n';
    WUXING_ELEMENTS.forEach(function(elem) {
      var section = ov.wuxing[elem] || {};
      var keywords = section.keywords || [];
      html += '<div class="wuxing-card" style="border-left-color:' + (WUXING_COLORS[elem] || '#666') + '">';
      html += '<strong>' + elem + '</strong> (w=' + (section.weight || 1.0) + ')<br>';
      keywords.forEach(function(kw) {
        html += '<span class="tag" style="background:' + (WUXING_COLORS[elem] || '#666') + '">' + kw + '</span> ';
      });
      html += '</div>\n';
    });
    html += '</div>\n';

    // 八卦
    if (ov.bagua && Object.keys(ov.bagua).length > 0) {
      html += '<h2>八卦映射</h2>\n<div class="wuxing-grid">\n';
      BAGUA_SYMBOLS.forEach(function(sym) {
        var section = ov.bagua[sym];
        if (!section) return;
        var keywords = section.keywords || [];
        html += '<div class="wuxing-card" style="border-left-color:' + (BAGUA_COLORS[sym] || '#666') + '">';
        html += '<strong>' + sym + '</strong> (w=' + (section.weight || 1.0) + ')<br>';
        keywords.forEach(function(kw) {
          html += '<span class="tag" style="background:' + (BAGUA_COLORS[sym] || '#666') + '">' + kw + '</span> ';
        });
        html += '</div>\n';
      });
      html += '</div>\n';
    }

    // 三层架构
    if (ov.layer_assignment) {
      html += '<h2>三层架构 (Base-View-SkillUP)</h2>\n<div class="layer-bar">\n';
      var layerColors = { outer: '#4ECDC4', middle: '#FFD93D', inner: '#FF6B6B' };
      LAYER_KEYS.forEach(function(key) {
        var layer = ov.layer_assignment[key] || {};
        html += '<div class="layer-item" style="background:' + (layerColors[key] || '#eee') + ';color:#fff">';
        html += (layer.label || key) + '<br><small>' + (layer.indicators || []).length + ' 个概念</small>';
        html += '</div>\n';
      });
      html += '</div>\n';
    }

    // 流转引擎
    var circ = ov.wuxing_circulation;
    if (circ && circ.stages) {
      html += '<h2>五行流转引擎</h2>\n';
      Object.keys(circ.stages).forEach(function(stage) {
        var s = circ.stages[stage];
        html += '<div class="card">\n';
        html += '<strong>' + stage + '</strong> — ' + (s.desc || '') + '<br>\n';
        html += '概念：' + (s.concepts || []).join('、') + '\n';
        html += '</div>\n';
      });
    }

    // 认知深度
    var cd = ov.cognitive_depth;
    if (cd && cd.concept_max_depth && Object.keys(cd.concept_max_depth).length > 0) {
      html += '<h2>L1-L4 认知深度</h2>\n<div class="card">\n';
      var depths = cd.concept_max_depth;
      var byDepth = { L1: [], L2: [], L3: [], L4: [] };
      Object.keys(depths).forEach(function(k) {
        var d = depths[k];
        if (byDepth[d]) byDepth[d].push(k);
      });
      Object.keys(byDepth).forEach(function(d) {
        if (byDepth[d].length > 0) {
          html += '<strong>' + d + '：</strong>' + byDepth[d].join('、') + '<br>\n';
        }
      });
      html += '</div>\n';
    }

    html += '<hr><p style="text-align:center;color:#999;font-size:12px">Generated by Meta-Skill Studio</p>\n';
    html += '</body>\n</html>';

    return html;
  }

  // ===== 全局函数暴露 =====
  window._studioSelectConcept = function(concept, element) {
    chatInput.value = '修正' + concept + '的归属为' + element;
    if (!isChatOpen) openChatPanel();
    sendChatMessage();
  };

  // ===== 初始化完成 =====
  console.log('[MetaSkillStudio] 初始化完成, domain=' + currentDomain + ', level=' + currentLevel);
})();
</script>
