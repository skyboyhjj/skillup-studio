services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ms-net
    mem_limit: 256m
    cpus: '1.0'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ms-api
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ms_user:${DB_PASSWORD}@db:5432/meta_skill
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - CORS_ORIGINS=https://meta-skill.org,https://hui-skill.cn,http://localhost:8088
      - LOG_LEVEL=INFO
      - RULES_BASE_PATH=/app/wuxing_rules/rules
    volumes:
      - ./data/rule_libraries:/app/data/rule_libraries
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ms-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    command: >
      gunicorn main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:8000
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 180
      --keep-alive 5

  db:
    image: postgres:16-alpine
    container_name: ms-db
    environment:
      - POSTGRES_USER=ms_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=meta_skill
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - ms-net
    mem_limit: 2g
    cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_user -d meta_skill"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c max_connections=100
      -c log_rotation_age=1d
      -c log_rotation_size=100MB

  redis:
    image: redis:7-alpine
    container_name: ms-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ms-net
    mem_limit: 256m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ms-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      device: /data/postgres
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /data/redis
      o: bind
  nginx_logs:
  app_logs: