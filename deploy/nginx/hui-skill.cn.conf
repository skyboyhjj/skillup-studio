# ============================================================
# hui-skill.cn Nginx 站点配置
# 服务器: 21.41.215.36 | 峰值带宽: 50 Mbps
# ============================================================

# 限流区域定义
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perconn:10m;

# 流量日志格式
log_format traffic '$remote_addr - $request_time $body_bytes_sent $status';
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name hui-skill.cn;

    root /var/www/hui-skill-product-matrix;
    index pages/index.html;

    # 访问日志
    access_log /var/log/nginx/hui-skill-access.log main;
    access_log /var/log/nginx/hui-skill-traffic.log traffic;
    error_log  /var/log/nginx/hui-skill-error.log;

    # ============================================================
    # 产品矩阵首页
    # ============================================================
    location = / {
        return 301 /pages/index.html;
    }

    # ============================================================
    # 产品矩阵页面
    # ============================================================
    location /pages/ {
        # 限流
        limit_req zone=perip burst=20 nodelay;
        limit_conn perconn 10;

        # HTML 不缓存
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # 静态资源缓存
    # ============================================================
    location /colors_and_type.css {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # API 反向代理（FastAPI 后端）
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 超时设置
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ============================================================
    # 莫比乌斯概念地图
    # ============================================================
    location /studio/ {
        alias /var/www/hui-skill-product-matrix/studio/;
        index index.html;
        try_files $uri $uri/ /studio/index.html;
    }

    # ============================================================
    # 通用
    # ============================================================
    location / {
        limit_req zone=perip burst=20 nodelay;
        limit_conn perconn 10;
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # 安全加固
    # ============================================================
    # 隐藏 Nginx 版本号
    server_tokens off;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}