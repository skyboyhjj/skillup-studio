# hui-skill.cn Nginx 配置
# 部署路径: /etc/nginx/sites-available/hui-skill.cn
# 激活: ln -s /etc/nginx/sites-available/hui-skill.cn /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name hui-skill.cn www.hui-skill.cn;

    # 日志
    access_log /var/log/nginx/hui-skill-access.log;
    error_log  /var/log/nginx/hui-skill-error.log;

    # 静态文件根路径
    root /var/www/hui-skill;
    index index.html;

    # FastAPI 后端代理
    # 微信 URL 提取 / 文本概念提取 / 预设数据等
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Studio 前端
    location /studio/ {
        alias /var/www/hui-skill/studio/;
        index index.html;
        try_files $uri $uri/ /studio/index.html;
    }

    # 根路径（如有 landing page）
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}