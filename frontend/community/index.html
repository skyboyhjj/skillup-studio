<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则库社区 — Meta-Skill.org</title>
<style>
:root {
  --bg-primary: #0f1117; --bg-secondary: #1a1d27; --bg-tertiary: #242836;
  --text-primary: #e4e6eb; --text-secondary: #a0a4b0; --text-muted: #6b7080;
  --border: #2a2e3a; --accent: #6c5ce7; --accent-hover: #7c6cf7;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 40px; gap: 24px;
}
.logo { font-size: 24px; font-weight: 700; color: var(--accent); }
.logo span { color: var(--text-secondary); font-weight: 400; }
h1 { font-size: 28px; font-weight: 600; }
p { color: var(--text-secondary); font-size: 15px; text-align: center; max-width: 480px; line-height: 1.6; }
.card {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px; display: flex;
  flex-direction: column; align-items: center; gap: 16px; max-width: 500px;
}
.badge {
  display: inline-block; padding: 4px 12px; border-radius: 12px;
  font-size: 12px; background: rgba(108,92,231,0.15); color: var(--accent);
}
.back-link {
  color: var(--accent); text-decoration: none; font-size: 14px;
  margin-top: 8px;
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="logo">Meta-Skill<span>Studio</span></div>
<div class="card">
  <h1>规则库社区</h1>
  <span class="badge">Phase 4 — 即将开放</span>
  <p>
    规则库社区将于后续版本上线。届时您可以在这里浏览、分享、Fork 五行八卦规则库，
    与社区成员协作完善领域知识映射。
  </p>
  <p style="font-size:13px;color:var(--text-muted)">
    计划功能：规则库浏览与搜索 &middot; 分享与 Fork &middot; 贡献者升级体系 &middot; 审核工作流
  </p>
</div>
<a href="/studio/" class="back-link">← 返回概念地图生成器</a>
</body>
</html>
